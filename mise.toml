[tools]
bun = "1.4.3"
gitleaks = "8.30.1"
lefthook = "2.2.2"

[env]
_.file = ".env"

[tasks.setup]
description = "Install dependencies, git hooks and local .env"
run = ["bun install", "lefthook install", "test -f .env || cp .env.example .env"]

[tasks."db:up"]
description = "Start Postgres"
run = "docker compose -f infra/docker-compose.yml up -d --wait"

[tasks."db:down"]
description = "Stop Postgres"
run = "docker compose -f infra/docker-compose.yml down"

[tasks.format]
description = "Format and apply safe lint fixes"
run = "bun run format"

[tasks.check]
description = "Lint, typecheck, test and scan for secrets"
run = ["bun run lint", "bun run typecheck", "bun run test", "gitleaks git --redact --no-banner"]

[tasks."dev:api"]
description = "API on localhost:3000"
run = "bun run --filter @masterforms/api dev"

[tasks."dev:web"]
description = "Web on localhost:5173"
run = "bun run --filter @masterforms/web dev"

[tasks.dev]
description = "Postgres, API and web together"
depends = ["db:up"]
run = "mise run dev:api ::: dev:web"

[tasks.ci]
description = "Everything CI runs"
run = [
  "bun install --frozen-lockfile",
  "mise run check",
  "bun run build",
  "bun audit --ignore=GHSA-vfj7-8cjw-p6xm",
]
