pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
